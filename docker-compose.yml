version: '3.8'

# =========================================================
# SmartCity AI (Gorakhpur) - Full-Stack Production Compose
# =========================================================

services:
  # -------------------------------------------------------
  # 1. DATABASE: MySQL 8.0 with Persistent Storage & Auto-Seed
  # -------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: smartcity-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-smartcity_root_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-smartcity}
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-executes upon initial volume creation in alphanumeric order
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - smartcity-net

  # -------------------------------------------------------
  # 2. BACKEND API: Node.js 20 Express + Socket.IO Server
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcity-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-smartcity_root_pass_2026}
      DB_NAME: ${DB_NAME:-smartcity}
      JWT_SECRET: ${JWT_SECRET:-smartcity_super_secret_production_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REQUIRE_AUTH: "true"
      AMBULANCE_UPDATE_TOKEN: ${AMBULANCE_UPDATE_TOKEN:-smartcity_ambulance_secret_2026}
      SIMULATE_AMBULANCES: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - smartcity-net

  # -------------------------------------------------------
  # 3. FRONTEND & REVERSE PROXY: Nginx High-Performance Web Server
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - smartcity-net

# ---------------------------------------------------------
# PERSISTENT VOLUMES
# ---------------------------------------------------------
volumes:
  mysql_data:
    name: smartcity_mysql_data
  backend_uploads:
    name: smartcity_backend_uploads

# ---------------------------------------------------------
# PRIVATE NETWORK
# ---------------------------------------------------------
networks:
  smartcity-net:
    name: smartcity-network
    driver: bridge
