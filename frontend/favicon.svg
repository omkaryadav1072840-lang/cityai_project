<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#cityGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- City Skyline Silhouette -->
  <path d="M10 52 V36 H18 V52 Z" fill="#ffffff" fill-opacity="0.25" />
  <path d="M18 52 V28 H26 V52 Z" fill="#ffffff" fill-opacity="0.4" />
  <path d="M26 52 V20 H34 V52 Z" fill="#ffffff" fill-opacity="0.85" />
  <path d="M34 52 V32 H42 V52 Z" fill="#ffffff" fill-opacity="0.5" />
  <path d="M42 52 V40 H50 V52 Z" fill="#ffffff" fill-opacity="0.3" />

  <!-- Antennas / Towers -->
  <line x1="30" y1="20" x2="30" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="30" cy="13" r="2.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- AI Brain / Circuit Network Node -->
  <circle cx="46" cy="18" r="5" fill="url(#aiGlow)" filter="url(#glow)" />
  <circle cx="46" cy="18" r="2" fill="#ffffff" />
  <path d="M33 18 H41" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1" />
  <path d="M46 23 V30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1" />

  <!-- Road / Digital Grid Line -->
  <path d="M6 52 Q32 48 58 52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
</svg>
